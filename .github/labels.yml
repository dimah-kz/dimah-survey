# Complete label set. .github/workflows/sync-labels.yml deletes labels that are
# not listed here.

# Type
- name: bug
  color: "d73a4a"
  description: Something isn't working

- name: enhancement
  color: "a2eeef"
  description: New feature or request

- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation

- name: question
  color: "d876e3"
  description: Further information is requested

- name: dependencies
  color: "0366d6"
  description: Dependency or GitHub Actions updates

- name: release
  color: "006b75"
  description: Versioning, changelog, or npm publish

- name: breaking
  color: "b60205"
  description: Breaking change for package consumers

# Status
- name: good first issue
  color: "7057ff"
  description: Good for newcomers

- name: help wanted
  color: "008672"
  description: Extra attention is needed

- name: needs triage
  color: "d93f0b"
  description: Needs a maintainer to confirm scope

- name: needs reproduction
  color: "f9d0c4"
  description: Needs a minimal reproduction

- name: duplicate
  color: "cfd3d7"
  description: This issue or pull request already exists

- name: invalid
  color: "e4e669"
  description: This doesn't seem right

- name: wontfix
  color: "ffffff"
  description: This will not be worked on

# Packages
- name: pkg:core
  color: "0e8a16"
  description: Changes in @dimah-survey/core

- name: pkg:server
  color: "1d76db"
  description: Changes in @dimah-survey/server

- name: pkg:db
  color: "fbca04"
  description: Changes in @dimah-survey/db

- name: pkg:react
  color: "61dafb"
  description: Changes in @dimah-survey/react

# Areas
- name: area:ci
  color: "5319e7"
  description: GitHub Actions, publish, or repository automation

- name: area:example
  color: "c2e0c6"
  description: The examples/next application

- name: area:tooling
  color: "bfd4f2"
  description: Shared ESLint, TypeScript, tsup, and Vitest config

- name: accessibility
  color: "f143ab"
  description: Barrier affecting people with disabilities
