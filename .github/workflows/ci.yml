name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Remote cache needs a Vercel `TURBO_TOKEN` Actions secret. Until one is set,
# jobs share a local .turbo cache via actions/cache.
env:
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Workspace consistency
        run: pnpm sherif

      - name: Unused files and dependencies
        run: pnpm knip

  packages:
    name: Build, Test & Types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dorny/paths-filter@v4
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            packages:
              - 'packages/**'
              - 'tooling/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

      - name: Resolve Turbo affected range
        if: github.event_name != 'workflow_dispatch' && steps.filter.outputs.packages == 'true'
        uses: ./.github/actions/turbo-affected-range

      - name: Setup
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.packages == 'true'
        uses: ./.github/actions/setup

      - name: Build, test, and typecheck packages
        if: github.event_name == 'workflow_dispatch'
        run: pnpm turbo run build test check-types --filter="./packages/*"

      - name: Build, test, and typecheck affected packages
        if: github.event_name != 'workflow_dispatch' && steps.filter.outputs.packages == 'true'
        run: pnpm turbo run build test check-types --affected --filter="./packages/*"

  docs:
    name: Build & Typecheck Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v4
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            docs:
              - 'apps/docs/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'package.json'
              - 'prettier.config.mjs'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

      - name: Setup
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true'
        uses: ./.github/actions/setup

      - name: Typecheck docs
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true'
        run: pnpm --filter docs check-types

      - name: Build docs
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true'
        run: pnpm --filter docs build
