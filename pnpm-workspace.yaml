packages:
  - "packages/*"
  - "tooling/*"
  - "examples/*"
  - "apps/*"

catalog:
  knip: ^6.39.0
  tegami: ^1.5.0
  "@better-fetch/fetch": 1.3.2
  "@eslint-community/eslint-plugin-eslint-comments": ^4.8.1
  better-call: 1.4.1
  "@eslint/js": ^10.0.1
  "@types/node": ^26.6.4
  "@vitest/eslint-plugin": ^1.6.27
  drizzle-orm: 1.0.0-rc.4
  drizzle-kit: 1.0.0-rc.4
  eslint: ^10.11.0
  eslint-config-next: 16.3.8
  happy-dom: ^20.14.5
  fumadb: ^0.6.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-import-x: ^4.17.1
  eslint-plugin-n: ^18.4.0
  eslint-plugin-package-json: ^1.10.1
  eslint-plugin-pnpm: ^1.9.1
  eslint-plugin-regexp: ^3.3.1
  eslint-plugin-turbo: ^2.11.6
  eslint-plugin-unicorn: ^76.0.0
  globals: ^17.13.0
  lefthook: ^2.1.16
  next: 16.3.8
  prettier: ^3.9.9
  prettier-plugin-packagejson: ^3.0.2
  prettier-plugin-tailwindcss: ^0.8.1
  react: ^19.3.0
  react-dom: ^19.3.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  sherif: ^1.13.0
  survey-core: ^3.1.2
  survey-creator-core: ^3.1.2
  survey-creator-react: ^3.1.2
  survey-react-ui: ^3.1.2
  tsc-alias: ^1.9.7
  tsup: ^8.5.1
  turbo: ^2.11.6
  typescript: 7.0.2
  typescript-eslint: ^8.71.0
  vitest: ^5.0.3
  zod: ^4.6.5

# TypeScript 7 has no compiler API. Next apps take the TypeScript 6 API from
# this catalog so typescript-eslint can load it. `tsc` is `@typescript/native`
# (TypeScript 7). Default-catalog `typescript` stays 7 for the libraries.
catalogs:
  typescript6:
    typescript: "npm:@typescript/typescript6@^6.0.2"
    "@typescript/native": "npm:typescript@7.0.2"

allowBuilds:
  esbuild: true
  lefthook: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.4"
  - "@turbo/darwin-arm64@2.11.4"
  - "@turbo/linux-64@2.11.4"
  - "@turbo/linux-arm64@2.11.4"
  - "@turbo/windows-64@2.11.4"
  - "@turbo/windows-arm64@2.11.4"
  - "@vitest/mocker@5.0.2"
  - "@vitest/spy@5.0.2"
  - eslint-plugin-turbo@2.11.4
  - turbo@2.11.4
  - vitest@5.0.2
